name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Verify production output
        run: |
          echo "=== dist contents ==="
          find dist -maxdepth 2 -type f | sort

          echo "=== dist/index.html ==="
          cat dist/index.html

          echo "=== Check for source main.tsx reference ==="
          if grep -q "/src/main.tsx" dist/index.html; then
            echo "ERROR: dist/index.html still references src/main.tsx"
            exit 1
          else
            echo "OK: dist/index.html contains production bundle"
          fi

          echo "=== Check required files ==="
          test -f dist/index.html
          test -d dist/assets

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
